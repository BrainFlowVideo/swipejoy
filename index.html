<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A daily pocket ritual for instant joy and micro-mindfulness.">
<meta name="theme-color" content="#0e0925">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SwipeJoy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>SwipeJoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.install{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:13.5px;line-height:1.35;border-radius:18px;flex:none}
.install .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(130deg,var(--btn-a),var(--btn-b));color:var(--btn-ink)}
.install button{margin-left:auto;flex:none;background:none;border:0;color:var(--muted);font-weight:600;padding:8px 4px}
/* Layout concept: a phone-shaped app shell. Arch-topped glass cards float over a sunrise of concentric gold arches, midnight indigo at the top melting into blush at the horizon. */
:root{
  --bg0:#0e0925; --bg1:#241150; --bg2:#5a2166; --page:#07041a;
  --glowsoft:rgba(245,155,180,.38);
  --glow:#f59bb4; --gold:#f4cb7e; --lav:#bba8f7; --heart:#ff7aa2;
  --text:#fcf5ef; --muted:rgba(252,245,239,.7); --faint:rgba(252,245,239,.14);
  --glass:rgba(255,255,255,.09); --glass-b:rgba(255,255,255,.22);
  --card-a:rgba(255,255,255,.18); --card-b:rgba(255,255,255,.05);
  --shadow:rgba(6,3,20,.6);
  --btn-a:#f8d98f; --btn-b:#f59bb4; --btn-ink:#2a1245;
  --ok:#9fe3b8; --warn:#ffb4a2;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg0:#fff4ea; --bg1:#fadfdf; --bg2:#dcd0f6; --page:#efe2d4;
    --glowsoft:rgba(238,143,168,.38);
    --glow:#ee8fa8; --gold:#b8760f; --lav:#7a5fc8; --heart:#e5457a;
    --text:#2b1746; --muted:rgba(43,23,70,.72); --faint:rgba(43,23,70,.12);
    --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.95);
    --card-a:rgba(255,255,255,.85); --card-b:rgba(255,255,255,.45);
    --shadow:rgba(90,50,110,.35);
    --ok:#1d7a4a; --warn:#b3402a;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg0:#fff4ea; --bg1:#fadfdf; --bg2:#dcd0f6; --page:#efe2d4;
  --glowsoft:rgba(238,143,168,.38);
  --glow:#ee8fa8; --gold:#b8760f; --lav:#7a5fc8; --heart:#e5457a;
  --text:#2b1746; --muted:rgba(43,23,70,.72); --faint:rgba(43,23,70,.12);
  --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.95);
  --card-a:rgba(255,255,255,.85); --card-b:rgba(255,255,255,.45);
  --shadow:rgba(90,50,110,.35);
  --ok:#1d7a4a; --warn:#b3402a;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg0:#0e0925; --bg1:#241150; --bg2:#5a2166; --page:#07041a;
  --glowsoft:rgba(245,155,180,.38);
  --glow:#f59bb4; --gold:#f4cb7e; --lav:#bba8f7; --heart:#ff7aa2;
  --text:#fcf5ef; --muted:rgba(252,245,239,.7); --faint:rgba(252,245,239,.14);
  --glass:rgba(255,255,255,.09); --glass-b:rgba(255,255,255,.22);
  --card-a:rgba(255,255,255,.18); --card-b:rgba(255,255,255,.05);
  --shadow:rgba(6,3,20,.6);
  --ok:#9fe3b8; --warn:#ffb4a2;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--page);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#root{height:100%;display:flex;justify-content:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- shell ---------- */
.app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(90% 46% at 50% 102%,var(--glowsoft),transparent 72%),
    radial-gradient(60% 30% at 8% 12%,rgba(187,168,247,.22),transparent 70%),
    linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 52%,var(--bg2) 100%)}
.island{display:none;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#05030f;z-index:5}
@media (min-width:520px){
  #root{align-items:center}
  .app{height:min(100%,880px);border-radius:48px;border:1px solid var(--glass-b);box-shadow:0 40px 90px -30px var(--shadow),0 0 0 8px rgba(0,0,0,.18)}
  .island{display:block}
  .screen{padding-top:52px!important}
}
.bgart{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bgart .a{fill:none;stroke:var(--gold);stroke-width:1.1}
.bgart .v{fill:none;stroke:var(--lav);stroke-width:1.2;stroke-linecap:round}
.bgart .sun{fill:var(--gold);opacity:.2}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;animation:viewIn .4s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 14px 30px -18px var(--shadow)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 24px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s ease,filter .2s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(120deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);box-shadow:0 14px 30px -12px var(--glow)}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-b);color:var(--text);font-weight:600;font-size:14px;padding:11px 16px}
.btn[disabled]{opacity:.5}

/* ---------- onboarding ---------- */
.onb{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 0 22px}
.dots{display:flex;gap:8px;justify-content:center;padding:6px 0 4px}
.dot{width:8px;height:8px;border-radius:99px;background:var(--faint);transition:all .3s ease}
.dot.on{width:26px;background:linear-gradient(90deg,var(--btn-a),var(--btn-b))}
.track{display:flex;flex:1;min-height:0;transition:transform .5s cubic-bezier(.65,0,.25,1)}
.slide{flex:0 0 100%;min-width:0;overflow-y:auto;padding:8px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.art{width:min(230px,62vw);height:auto;flex:none;margin-top:10px}
.art .ln{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round}
.art .thick{stroke-width:2.2}
.art .cardA{fill:var(--glass);stroke:var(--glass-b);stroke-width:1.2}
.art .cardB{fill:var(--card-a);stroke:var(--gold);stroke-width:1.4}
.art .leaf{fill:var(--lav)}
.art .leafg{fill:var(--gold)}
.slide h2{font-size:clamp(28px,8vw,34px);line-height:1.1;font-weight:400}
.slide p{max-width:30ch;color:var(--muted);font-size:16px}
.namefield{width:100%;max-width:320px;display:flex;flex-direction:column;gap:6px;text-align:left}
.namefield label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;background:var(--glass);border:1px solid var(--glass-b);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.field::placeholder{color:var(--muted)}
.nudge{width:100%;max-width:320px;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-radius:18px;color:var(--text);font-size:13.5px;line-height:1.35}
.nudge .ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(130deg,var(--btn-a),var(--btn-b));color:var(--btn-ink)}
.nudge b{display:block;font-size:14px}
.onbfoot{display:flex;gap:12px;padding:6px 26px 0;align-items:center}
.onbfoot .btn-primary{flex:1}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:600;padding:12px 6px}

/* ---------- home ---------- */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.greet{font-family:var(--display);font-size:27px;line-height:1.15;font-weight:400;letter-spacing:-.01em;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.streak{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.streak svg{color:var(--gold)}
.progress{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:999px}
.slots{display:flex;gap:6px}
.slot{color:var(--faint);transition:color .3s}
.slot.on{color:var(--heart);animation:slotPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes slotPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.progress .txt{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.progress .ends{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.stage{position:relative;flex:1;min-height:340px;display:flex;align-items:center;justify-content:center}
.deck{position:relative;width:min(100%,336px);height:clamp(340px,50vh,430px);height:clamp(340px,50dvh,430px)}
.card{position:absolute;inset:0;border-radius:190px 190px 30px 30px;background:linear-gradient(165deg,var(--card-a),var(--card-b));border:1px solid var(--glass-b);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 34px 60px -26px var(--shadow)}
.card::before{content:"";position:absolute;inset:10px;border-radius:182px 182px 22px 22px;border:1px solid var(--gold);opacity:.45;pointer-events:none}
.card.back{pointer-events:none}
.card.top{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform;animation:cardIn .55s cubic-bezier(.2,.9,.3,1.1) both}
.card.top:active{cursor:grabbing}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.cardin{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:64px 36px 38px}
.cardin .sp{color:var(--gold)}
.aff{font-family:var(--display);font-size:clamp(22px,6.4vw,27px);line-height:1.22;font-weight:400;letter-spacing:-.01em;text-wrap:balance;font-variation-settings:"opsz" 72}
.stamp{position:absolute;top:92px;font-family:var(--display);font-size:20px;padding:5px 14px;border:2px solid;border-radius:999px;opacity:0;transition:opacity .15s}
.stamp.like{right:26px;color:var(--heart);border-color:var(--heart);transform:rotate(9deg)}
.stamp.pass{left:26px;color:var(--muted);border-color:var(--muted);transform:rotate(-9deg)}
.stamp.on{opacity:1}

.actions{display:flex;align-items:flex-start;justify-content:center;gap:34px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:0;padding:0}
.passbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:var(--text);margin-top:12px;transition:transform .15s}
.heartbtn{width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#ff9bb9,#f0527f);box-shadow:0 18px 34px -12px #f0527f,inset 0 2px 0 rgba(255,255,255,.4);transition:transform .15s}
.heartbtn.pulse{animation:hbeat .55s ease}
.act:active .passbtn,.act:active .heartbtn{transform:scale(.92)}
@keyframes hbeat{0%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.94)}100%{transform:scale(1)}}
.hint{text-align:center;font-size:12.5px;color:var(--muted)}

.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:4}
.p{position:absolute;left:0;top:0;animation:pop .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}60%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s)) rotate(160deg);opacity:0}}
.bigheart{position:absolute;left:0;top:0;color:var(--heart);animation:big .85s ease-out forwards}
@keyframes big{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}35%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}}

/* ---------- completion ---------- */
.share{position:relative;width:min(100%,340px);margin:0 auto;aspect-ratio:4/5;border-radius:170px 170px 30px 30px;overflow:hidden;padding:46px 26px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;color:#fff8f0;
  background:linear-gradient(180deg,#1b0e45 0%,#4b1f66 42%,#d9778f 80%,#f5c984 100%);box-shadow:0 40px 70px -30px var(--shadow),0 0 0 1px rgba(255,255,255,.25) inset;animation:viewIn .7s ease both}
.share svg.deco{position:absolute;left:0;bottom:0;width:100%;height:auto;pointer-events:none}
.share>*:not(.deco){position:relative;z-index:1}
.share .word{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ffe3a6}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#3a1650;background:radial-gradient(circle at 35% 30%,#fff1c9,#f5c984 60%,#ee9aa9);box-shadow:0 0 0 6px rgba(255,236,190,.2),0 14px 30px -10px rgba(0,0,0,.5);animation:badgeIn .9s cubic-bezier(.2,1.3,.4,1) both .2s}
@keyframes badgeIn{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.share h2{font-family:var(--display);font-size:25px;font-weight:400;line-height:1.1;letter-spacing:-.01em}
.share ul{list-style:none;display:flex;flex-direction:column;gap:9px;width:100%;margin-top:2px}
.share li{font-family:var(--display);font-size:16.5px;line-height:1.28;padding-top:9px;border-top:1px solid rgba(255,236,190,.35);text-wrap:balance}
.share .foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.08em;color:#fff8f0;font-variant-numeric:tabular-nums}
.share .foot .chip{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}
.socials{display:flex;flex-direction:column;align-items:center;gap:12px}
.socrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.soc{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px}
.soc svg{color:var(--gold)}
.cap{width:100%;min-height:90px;resize:none;border-radius:16px;padding:12px;font-size:14px}
.count{padding:20px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.clock{font-family:var(--display);font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bf{display:flex;flex-direction:column;gap:12px;padding:20px;text-decoration:none;color:var(--text);position:relative;overflow:hidden;border-radius:26px}
.bf::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--gold),transparent 40%,var(--lav));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.bf h3{font-family:var(--display);font-size:21px;font-weight:400;line-height:1.2;text-wrap:balance}
.bf .go{align-self:flex-start}

/* ---------- profile ---------- */
.prof{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:64px;height:76px;border-radius:32px 32px 14px 14px;display:grid;place-items:center;font-family:var(--display);font-size:28px;background:linear-gradient(165deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);box-shadow:0 14px 26px -14px var(--glow)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h3{font-family:var(--display);font-size:20px;font-weight:400}
.stack{display:flex;flex-direction:column;gap:6px}
.stack label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tile svg{color:var(--gold)}
.tile b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.log{list-style:none;display:flex;flex-direction:column;overflow:hidden;padding:4px 16px}
.log li{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--faint)}
.log li:first-child{border-top:0}
.log .t{font-family:var(--display);font-size:16px;line-height:1.3}
.log .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:14px}
.rem{padding:16px;display:flex;flex-direction:column;gap:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-b);text-align:left;font-weight:600}
.knob{flex:none;width:50px;height:30px;border-radius:99px;background:var(--faint);position:relative;transition:background .25s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch[aria-checked="true"] .knob{background:linear-gradient(120deg,var(--btn-a),var(--btn-b))}
.switch[aria-checked="true"] .knob::after{transform:translateX(20px)}
.msg{font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-b)}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--warn)}
.fine{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:linear-gradient(120deg,var(--btn-a),var(--btn-b));color:var(--btn-ink)}
.danger{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dbtn{background:none;border:1px solid var(--faint);border-radius:99px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--muted)}
.dbtn.hot{border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- nav ---------- */
.nav{position:relative;z-index:2;margin:0 16px 12px;padding:6px;display:flex;gap:4px;border-radius:28px}

(function(){

/* ---------- helpers ---------- */
var pad = function(n){ return String(n).padStart(2,'0'); };
var dkey = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var todayKey = function(d){ return dkey(d || new Date()); };
var yesterdayKey = function(){ var y = new Date(); y.setDate(y.getDate()-1); return dkey(y); };
var msToMidnight = function(now){ var d = new Date(now); var m = new Date(d); m.setHours(24,0,0,0); return m - d; };
var fmtCountdown = function(ms){ var t = Math.max(0, Math.floor(ms/1000)); return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60); };
var fmt12 = function(hm){ var p = hm.split(':').map(Number); var h = p[0], m = p[1]; return ((h%12)||12)+':'+pad(m)+' '+(h>=12?'PM':'AM'); };
var prettyDate = function(k, opts){ return new Date(k+'T00:00:00').toLocaleDateString(undefined, opts); };
var hello = function(now){ var h = new Date(now).getHours(); return h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening'; };

function hashStr(str){ var h = 1779033703 ^ str.length; for (var i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } return h>>>0; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function buildDeck(key){
  var rnd = mulberry32(hashStr('swipejoy-'+key));
  var idx = ALL.map(function(_,i){ return i; });
  for (var i=idx.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return idx.slice(0,120).map(function(i){ return ALL[i]; });
}

/* ---------- storage ---------- */
var KEY = 'swipejoy:v1';
var DEFAULT = { onboarded:false, name:'', mantra:'', reminderTime:'08:00', reminderOn:false, notifPerm:'default', lastNotified:null, theme:'system',
  streak:0, bestStreak:0, lastCompleted:null, totalHearts:0, history:[], today:{ date:null, hearts:[], pos:0, done:false } };
function load(){ try { var raw = localStorage.getItem(KEY); if (raw) return Object.assign({}, DEFAULT, JSON.parse(raw)); } catch(e){} return Object.assign({}, DEFAULT); }
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
function normalize(p){
  var t = todayKey(), y = yesterdayKey(), n = Object.assign({}, p);
  if (!n.today || n.today.date !== t) n.today = { date:t, hearts:[], pos:0, done:false };
  if (n.streak > 0 && n.lastCompleted !== t && n.lastCompleted !== y) n.streak = 0;
  return n;
}

/* ---------- icons (Lucide paths, inlined) ---------- */

};
function Icon(props){

  return html`<svg className=${props.cls||''} width=${size} height=${size} viewBox="0 0 24 24" fill=${props.fill||'none'} stroke=${props.fill?'none':'currentColor'} strokeWidth=${props.sw||1.8} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{__html: ICONS[props.n]}} />`;
}

/* ---------- decorative art ---------- */
function BgArt(){
  var arcs = [60,100,140,180,220,260,300].map(function(r,i){
    return html`<path key=${i} className="a" style=${{opacity: .5 - i*.05}} d=${'M'+(200-r)+' 800a'+r+' '+r+' 0 0 1 '+(2*r)+' 0'} />`;
  });
  return html`<svg className="bgart" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle className="sun" cx="200" cy="800" r="48"/>
    ${arcs}
    <path className="v" style=${{opacity:.4}} d="M-10 200C40 170 70 230 30 270S20 360 80 380"/>
    <path className="v" style=${{opacity:.35}} d="M410 520C360 490 330 550 370 590S380 680 320 700"/>
    <path className="v" style=${{opacity:.3}} d="M-10 560C30 540 50 590 20 620"/>
  </svg>`;
}
function Art(props){
  var k = props.kind;
  if (k === 0) {
    var rays = [];
    for (var i=0;i<9;i++){ var a = Math.PI + (i+.5)*Math.PI/9; rays.push(html`<line key=${i} x1=${110+Math.cos(a)*100} y1=${170+Math.sin(a)*100} x2=${110+Math.cos(a)*118} y2=${170+Math.sin(a)*118} className="ln"/>`); }
    return html`<svg className="art" viewBox="0 0 220 190" role="img" aria-label="A sun rising behind arches">
      <defs><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#ffe7a8"/><stop offset="1" stopColor="#f59bb4"/></linearGradient></defs>
      <path d="M80 170a30 30 0 0 1 60 0Z" fill="url(#g0)"/>
      <path d="M62 170a48 48 0 0 1 96 0" className="ln"/><path d="M44 170a66 66 0 0 1 132 0" className="ln"/><path d="M26 170a84 84 0 0 1 168 0" className="ln"/>
      ${rays}<path d="M10 170H210" className="ln"/></svg>`;
  }
  if (k === 1) {
    return html`<svg className="art" viewBox="0 0 220 190" role="img" aria-label="A stack of affirmation cards with a heart">
      <g transform="rotate(-12 60 176)"><path d="M28 176V86a32 32 0 0 1 64 0V176Z" className="cardA"/></g>
      <g transform="rotate(12 160 176)"><path d="M128 176V86a32 32 0 0 1 64 0V176Z" className="cardA"/></g>
      <path d="M76 180V74a34 34 0 0 1 68 0V180Z" className="cardB"/>
      <g transform="translate(94 96) scale(1.3)"><path d=${HEART} fill="#ff7aa2"/></g>
      <path d="M92 150h36M98 160h24" className="ln"/></svg>`;
  }
  return html`<svg className="art" viewBox="0 0 220 190" role="img" aria-label="A vine growing toward the sun">
    <circle cx="112" cy="26" r="12" fill="#ffd98a"/>
    <path d="M110 188C84 152 134 130 108 94S96 54 112 40" className="ln thick"/>
    <g transform="translate(112 150) rotate(20) scale(1.5)"><path d=${LEAF} className="leaf"/></g>
    <g transform="translate(92 118) rotate(-100) scale(1.3)"><path d=${LEAF} className="leafg"/></g>
    <g transform="translate(112 90) rotate(25) scale(1.2)"><path d=${LEAF} className="leaf"/></g>
    <path d="M30 188H190" className="ln"/><path d="M50 188a60 60 0 0 1 120 0" className="ln" style=${{opacity:.4}}/></svg>`;
}

/* ---------- onboarding ---------- */
function Onboarding(props){
  var st = useState(0), step = st[0], setStep = st[1];
  var nm = useState(''), name = nm[0], setName = nm[1];
  var nt = useState('idle'), notif = nt[0], setNotif = nt[1];
  var askNotif = function(){
    if (typeof Notification === 'undefined') { setNotif('unsupported'); return; }
    var done = function(p){ setNotif(p === 'granted' ? 'granted' : 'denied'); };
    try { var r = Notification.requestPermission(); if (r && r.then) r.then(done, function(){ setNotif('denied'); }); else done(r); } catch(e){ setNotif('denied'); }
  };
  var finish = function(){ props.onDone({ name: name.trim() || 'Friend', reminderOn: notif === 'granted', notifPerm: notif === 'granted' ? 'granted' : 'default' }); };
  var nudgeText = notif === 'granted' ? 'Reminders are on for 8:00 AM.' : notif === 'denied' ? 'Notifications are blocked here. You can turn them on later in your profile.' : notif === 'unsupported' ? 'This browser has no notifications. Add SwipeJoy to your Home Screen for the best experience.' : 'Get a gentle nudge each morning to build a gratitude practice.';
  var slides = [
    { art:0, h:'Welcome to SwipeJoy ✨', p:'Your daily pocket ritual for instant joy and micro-mindfulness.' },
    { art:1, h:'Swipe & Enjoy 💖', p:"Browse through curated affirmations. Pass on what doesn't fit, and tap the heart on 3 that resonate and make you feel that spark of joy." },
    { art:2, h:'Build Your Flow 🌿', p:'Set your name to personalize your daily practice and build your streak. (Plus, connect seamlessly to BrainFlow when you want to go deeper).' }
  ];
  return html`<div className="onb">
    <div className="dots" role="group" aria-label=${'Step '+(step+1)+' of 3'}>${[0,1,2].map(function(i){ return html`<span key=${i} className=${'dot'+(i===step?' on':'')}></span>`; })}</div>
    <div className="track" style=${{transform:'translateX(-'+(step*100)+'%)'}}>
      ${slides.map(function(sl,i){
        return html`<section key=${i} className="slide" aria-hidden=${i!==step} inert=${i!==step?'':undefined}>
          <${Art} kind=${sl.art}/>
          <h2 className="display">${sl.h}</h2>
          <p>${sl.p}</p>
          ${i===2 && html`<div className="namefield">
              <label htmlFor="name-input">Your name</label>
              <input id="name-input" className="field" type="text" autoComplete="given-name" maxLength="24" placeholder="What should we call you?" value=${name} onChange=${function(e){ setName(e.target.value); }} onKeyDown=${function(e){ if (e.key==='Enter') finish(); }} />
            </div>`}
          ${i===2 && html`<button type="button" className="nudge glass" onClick=${askNotif} disabled=${notif==='granted'}>
              <span className="ic"><${Icon} n=${notif==='granted'?'check':'bell'} size=${18}/></span>
              <span><b>${notif==='granted'?'Daily reminders on':'Allow daily reminders'}</b>${nudgeText}</span>
            </button>`}
        </section>`;
      })}
    </div>
    <div className="onbfoot">
      ${step>0 ? html`<button type="button" className="linkbtn" onClick=${function(){ setStep(step-1); }}>Back</button>` : null}
      ${step<2 ? html`<button type="button" className="btn btn-primary" onClick=${function(){ setStep(step+1); }}>Continue <${Icon} n="arrow" size=${18}/></button>`
                : html`<button type="button" className="btn btn-primary" onClick=${finish}>Get Started <${Icon} n="sparkles" size=${18}/></button>`}
    </div>
  </div>`;
}

/* ---------- burst ---------- */
function makeBurst(){
  var colors = ['var(--gold)','var(--heart)','var(--lav)','#ffffff'], parts = [];
  for (var i=0;i<24;i++){
    var a = Math.random()*Math.PI*2, r = 70 + Math.random()*140;
    parts.push({ id:i, dx:Math.cos(a)*r, dy:Math.sin(a)*r - 30, s:.6+Math.random()*1.1, c:colors[i%4], d:Math.random()*.12, heart:i%3===0 });
  }
  return { id: Date.now()+Math.random(), parts: parts };
}

/* ---------- today's session ---------- */
function Session(props){
  var s = props.s, update = props.update, now = props.now;
  var t = todayKey(new Date(now));
  var deck = useMemo(function(){ return buildDeck(t); }, [t]);
  var pos = s.today.pos, hearts = s.today.hearts;
  var card = deck[pos % deck.length];
  var topRef = useRef(null), busy = useRef(false), drag = useRef(null);
  var bs = useState([]), bursts = bs[0], setBursts = bs[1];
  var pl = useState(0), pulse = pl[0], setPulse = pl[1];
  var dh = useState(null), dirHint = dh[0], setDirHint = dh[1];

  var commit = function(liked, c){
    var ts = Date.now();
    update(function(p){
      var td = Object.assign({}, p.today, { pos: p.today.pos + 1 });
      if (!liked) return { today: td };
      var hs = p.today.hearts.concat([{ text:c.text, theme:c.theme }]);
      td.hearts = hs;
      var out = { today: td, totalHearts: p.totalHearts + 1, history: [{ text:c.text, theme:c.theme, date:todayKey(), ts:ts }].concat(p.history).slice(0,300) };
      if (hs.length >= 3) {
        var base = p.lastCompleted === yesterdayKey() ? p.streak : (p.lastCompleted === todayKey() ? p.streak - 1 : 0);
        var streak = p.lastCompleted === todayKey() ? p.streak : base + 1;
        td.done = true;
        out.streak = streak; out.bestStreak = Math.max(p.bestStreak, streak); out.lastCompleted = todayKey();
      }
      return out;
    });
  };
  var fling = function(dir){
    if (busy.current) return;
    busy.current = true;
    var el = topRef.current, c = card;
    if (el) {
      el.style.transition = 'transform .45s cubic-bezier(.5,0,.9,.4), opacity .45s ease';
      el.style.transform = 'translate('+(dir*130)+'%,'+(dir>0?-18:6)+'%) rotate('+(dir*16)+'deg)';
      el.style.opacity = '0';
    }
    if (dir > 0) {
      var b = makeBurst();
      setBursts(function(x){ return x.concat([b]); });
      setPulse(function(p){ return p+1; });
      setTimeout(function(){ setBursts(function(x){ return x.filter(function(y){ return y.id !== b.id; }); }); }, 1100);
    }
    setTimeout(function(){ commit(dir>0, c); busy.current = false; }, dir>0 ? 600 : 400);
  };

  useEffect(function(){
    var onKey = function(e){
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') fling(1);
      if (e.key === 'ArrowLeft') fling(-1);
    };
    window.addEventListener('keydown', onKey);
    return function(){ window.removeEventListener('keydown', onKey); };
  });

  var down = function(e){
    if (busy.current) return;
    drag.current = { x:e.clientX, y:e.clientY, dx:0 };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
    e.currentTarget.style.transition = 'none';
  };
  var move = function(e){
    var d = drag.current; if (!d) return;
    d.dx = e.clientX - d.x;
    e.currentTarget.style.transform = 'translate('+d.dx+'px,'+((e.clientY-d.y)*.2)+'px) rotate('+(d.dx/18)+'deg)';
    var h = d.dx > 40 ? 'like' : d.dx < -40 ? 'pass' : null;
    setDirHint(function(p){ return p === h ? p : h; });
  };
  var up = function(e){
    var d = drag.current; drag.current = null; if (!d) return;
    var el = e.currentTarget;
    setDirHint(null);
    if (d.dx > 90) fling(1);
    else if (d.dx < -90) fling(-1);
    else { el.style.transition = 'transform .4s cubic-bezier(.2,.9,.3,1.2)'; el.style.transform = ''; }
  };

  var name = s.name || 'Friend';
  var sub = s.mantra ? '“'+s.mantra+'”' : hello(now)+'. Find 3 that feel like you.';
  var left = fmtCountdown(msToMidnight(now));

  return html`<div className="view">
    <div className="hdr">
      <div style=${{minWidth:0}}><h1 className="greet">Hi, ${name} ✨</h1><p className="sub">${sub}</p></div>
      <div className="streak glass" aria-label=${s.streak+' day streak'}><${Icon} n="flame" size=${18} fill="currentColor"/><b>${s.streak}</b></div>
    </div>
    <div className="progress glass">
      <div className="slots" aria-hidden="true">${[0,1,2].map(function(i){ return html`<span key=${i} className=${'slot'+(i<hearts.length?' on':'')}><${Icon} n="heart" size=${22} fill="currentColor"/></span>`; })}</div>
      <span className="txt" aria-live="polite">${hearts.length} of 3 hearts collected</span>
      <span className="ends"><${Icon} n="clock" size=${13}/>${left}</span>
    </div>
    <div className="stage">
      <div className="deck">
        ${[2,1].map(function(i){ return html`<div key=${'b'+i} className="card back" style=${{transform:'translateY('+(i*15)+'px) scale('+(1-i*.055)+')',opacity:1-i*.28}}></div>`; })}
        <div key=${'top-'+pos} ref=${topRef} className="card top" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
          <span className=${'stamp like'+(dirHint==='like'?' on':'')}>Joy</span>
          <span className=${'stamp pass'+(dirHint==='pass'?' on':'')}>Pass</span>
          <div className="cardin">
            <span className="sp"><${Icon} n="sparkles" size=${22}/></span>
            <span className="eyebrow">${card.theme}</span>
            <p className="aff">${card.text}</p>
          </div>
        </div>
        ${bursts.map(function(b){
          return html`<div className="burst" key=${b.id} aria-hidden="true">
            <span className="bigheart"><${Icon} n="heart" size=${70} fill="currentColor"/></span>
            ${b.parts.map(function(p){ return html`<span key=${p.id} className="p" style=${{'--dx':p.dx+'px','--dy':p.dy+'px','--s':p.s,color:p.c,animationDelay:p.d+'s'}}><${Icon} n=${p.heart?'heart':'star'} size=${p.heart?16:14} fill="currentColor"/></span>`; })}
          </div>`;
        })}
      </div>
    </div>
    <div className="actions">
      <button type="button" className="act" onClick=${function(){ fling(-1); }} aria-label="Pass to the next affirmation"><span className="passbtn glass"><${Icon} n="x" size=${24}/></span>Next</button>
      <button type="button" key=${'h'+pulse} className="act" onClick=${function(){ fling(1); }} aria-label="Find joy in this affirmation"><span className=${'heartbtn'+(pulse?' pulse':'')}><${Icon} n="heart" size=${36} fill="currentColor"/></span>Find Joy</button>
    </div>
    <p className="hint">Swipe right to heart it, left to pass.</p>
  </div>`;
}

/* ---------- completion ---------- */
function Complete(props){
  var s = props.s, now = props.now, hearts = s.today.hearts;
  var cs = useState('idle'), copyState = cs[0], setCopy = cs[1];
  var caption = 'Day '+s.streak+' of finding joy with SwipeJoy ✨\n\n'+hearts.map(function(h){ return '• '+h.text; }).join('\n');
  var copy = function(){
    var ok = function(){ setCopy('copied'); setTimeout(function(){ setCopy('idle'); }, 2200); };
    try { navigator.clipboard.writeText(caption).then(ok, function(){ setCopy('manual'); }); } catch(e){ setCopy('manual'); }
  };
  var arcs = [50,80,110,140,170].map(function(r,i){ return html`<path key=${i} d=${'M'+(170-r)+' 190a'+r+' '+r+' 0 0 1 '+(2*r)+' 0'} fill="none" stroke="rgba(255,236,190,.4)" strokeWidth="1"/>`; });
  var name = s.name || 'Friend';
  return html`<div className="view">
    <div className="hdr">
      <div style=${{minWidth:0}}><h1 className="greet">Joy found, ${name} ✨</h1><p className="sub">Today's goal is locked in. Beautiful work.</p></div>
      <div className="streak glass"><${Icon} n="flame" size=${18} fill="currentColor"/><b>${s.streak}</b></div>
    </div>
    <div className="share" id="share-card">
      <svg className="deco" viewBox="0 0 340 190" aria-hidden="true"><circle cx="170" cy="190" r="34" fill="rgba(255,226,160,.6)"/>${arcs}</svg>
      <div className="word"><${Icon} n="sparkles" size=${14}/>SwipeJoy</div>
      <div className="badge"><${Icon} n="check" size=${30} sw=${2.6}/></div>
      <h2>Three sparks of joy</h2>
      <p style=${{fontSize:'12px',letterSpacing:'.14em',textTransform:'uppercase',color:'#ffe3a6',fontWeight:600}}>${prettyDate(todayKey(new Date(now)),{weekday:'long',month:'long',day:'numeric'})}</p>
      <ul>${hearts.map(function(h,i){ return html`<li key=${i}>${h.text}</li>`; })}</ul>
      <div className="foot"><span className="chip"><${Icon} n="flame" size=${13} fill="currentColor"/>Day ${s.streak} streak</span><span>swipejoy</span></div>
    </div>
    <div className="socials">
      <p className="hint">Screenshot this card and share it to your story.</p>
      <div className="socrow">
        <a className="soc glass" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"><${Icon} n="insta" size=${18}/>Instagram</a>
        <a className="soc glass" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer"><${Icon} n="tiktok" size=${18}/>TikTok</a>
        <button type="button" className="soc glass" onClick=${copy}><${Icon} n=${copyState==='copied'?'check':'copy'} size=${18}/>${copyState==='copied'?'Copied':'Copy caption'}</button>
      </div>
      ${copyState==='manual' && html`<textarea className="field cap" readOnly autoFocus value=${caption} aria-label="Caption to copy" onFocus=${function(e){ e.target.select(); }}></textarea>`}
    </div>
    <div className="count glass">
      <span className="eyebrow">Next joy unlocks in</span>
      <span className="clock" aria-live="off">${fmtCountdown(msToMidnight(now))}</span>
      <span className="fine">Come back tomorrow to take your streak to day ${s.streak+1}.</span>
    </div>
    <a className="bf glass" href="https://example.com/brainflow" target="_blank" rel="noopener noreferrer">
      <span className="eyebrow">The next step</span>
      <h3>Want to go deeper? Continue your flow with guided sessions in BrainFlow.</h3>
      <span className="btn btn-primary go">Open BrainFlow <${Icon} n="out" size=${18}/></span>
    </a>
  </div>`;
}

/* ---------- profile ---------- */
function Profile(props){
  var s = props.s, update = props.update;
  var ms = useState(null), msg = ms[0], setMsg = ms[1];
  var cf = useState(false), confirm = cf[0], setConfirm = cf[1];
  var toggleReminder = function(){
    if (s.reminderOn) { update({ reminderOn:false }); setMsg({ ok:true, t:'Daily reminder turned off.' }); return; }
    if (typeof Notification === 'undefined') { setMsg({ ok:false, t:"This browser can't show notifications. Add SwipeJoy to your Home Screen to get reminders." }); return; }
    var done = function(p){
      update({ notifPerm:p, reminderOn: p === 'granted' });
      setMsg(p === 'granted' ? { ok:true, t:'Reminder set for '+fmt12(s.reminderTime)+'! ✨' } : { ok:false, t:'Notifications are blocked. Allow them in your browser settings, then try again.' });
    };
    try { var r = Notification.requestPermission(); if (r && r.then) r.then(done, function(){ done('denied'); }); else done(r); } catch(e){ done('denied'); }
  };
  var setTime = function(v){
    if (!v) return;
    update({ reminderTime:v });
    if (s.reminderOn) setMsg({ ok:true, t:'Reminder updated to '+fmt12(v)+'! ✨' });
  };
  var themes = [['system','System','monitor'],['light','Light','sun'],['dark','Dark','moon']];
  var initial = (s.name || 'F').trim().charAt(0).toUpperCase();
  return html`<div className="view">
    <div className="prof">
      <div className="avatar" aria-hidden="true">${initial}</div>
      <div style=${{minWidth:0}}><h1 className="greet">${s.name || 'Friend'}</h1><p className="sub">Your joy, so far.</p></div>
    </div>

    <div className="tiles">
      <div className="tile glass"><${Icon} n="flame" size=${20} fill="currentColor"/><b>${s.streak}</b><span>Current streak</span></div>
      <div className="tile glass"><${Icon} n="heart" size=${20} fill="currentColor"/><b>${s.totalHearts}</b><span>Hearts collected</span></div>
      <div className="tile glass"><${Icon} n="trophy" size=${20}/><b>${s.bestStreak}</b><span>Best streak</span></div>
    </div>

    <div className="sec">
      <h3>About you</h3>
      <div className="stack"><label htmlFor="prof-name">Name</label>
        <input id="prof-name" className="field" type="text" maxLength="24" autoComplete="given-name" value=${s.name} placeholder="Friend" onChange=${function(e){ update({ name:e.target.value }); }}/></div>
      <div className="stack"><label htmlFor="prof-mantra">Custom mantra</label>
        <input id="prof-mantra" className="field" type="text" maxLength="80" value=${s.mantra} placeholder="Something to carry with you today" onChange=${function(e){ update({ mantra:e.target.value }); }}/>
        <span className="fine">Shown under your greeting. Saves as you type.</span></div>
    </div>

    <div className="sec">
      <h3>Joy log</h3>
      ${s.history.length === 0
        ? html`<div className="glass empty">Affirmations you heart will gather here.</div>`
        : html`<ul className="log glass">${s.history.slice(0,40).map(function(h){ return html`<li key=${h.ts}><span className="t">${h.text}</span><span className="m"><span>${prettyDate(h.date,{month:'short',day:'numeric'})}</span><span>·</span><span>${h.theme}</span></span></li>`; })}</ul>`}
    </div>

    <div className="sec">
      <h3>Daily reminder</h3>
      <div className="rem glass">
        <div className="stack"><label htmlFor="rtime">Reminder time</label>
          <input id="rtime" className="field" type="time" value=${s.reminderTime} onChange=${function(e){ setTime(e.target.value); }}/></div>
        <button type="button" role="switch" aria-checked=${s.reminderOn} className="switch" onClick=${toggleReminder}>
          <span>Set Daily Reminder<br/><span className="fine" style=${{fontWeight:500}}>${s.reminderOn ? 'On at '+fmt12(s.reminderTime) : 'Off'}</span></span>
          <span className="knob"></span>
        </button>
        ${msg && html`<div className=${'msg '+(msg.ok?'ok':'bad')} role="status">${msg.t}</div>`}
        <span className="fine">Browsers send reminders while SwipeJoy is open in a tab or added to your Home Screen.</span>
      </div>
    </div>

    <div className="sec">
      <h3>Theme</h3>
      <div className="seg glass" role="group" aria-label="Theme">
        ${themes.map(function(t){ return html`<button key=${t[0]} type="button" aria-pressed=${s.theme===t[0]} onClick=${function(){ update({ theme:t[0] }); }}><${Icon} n=${t[2]} size=${16}/>${t[1]}</button>`; })}
      </div>
    </div>

    <div className="sec danger">
      ${!confirm
        ? html`<button type="button" className="dbtn" onClick=${function(){ setConfirm(true); }}>Reset all data</button>`
        : html`<div className="msg bad" role="alert">This clears your name, streak and hearts, and replays the welcome tour.</div>
               <div className="row"><button type="button" className="dbtn" onClick=${function(){ setConfirm(false); }}>Keep my data</button>
               <button type="button" className="dbtn hot" onClick=${props.onReset}>Yes, reset everything</button></div>`}
    </div>
  </div>`;
}

/* ---------- install hint (iPhone Safari only) ---------- */
function InstallHint(){
  var st = useState(function(){ try { return localStorage.getItem('swipejoy:install') === '1'; } catch(e){ return false; } }), dismissed = st[0], setD = st[1];
  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (standalone || dismissed || !ios) return null;
  var close = function(){ try { localStorage.setItem('swipejoy:install','1'); } catch(e){} setD(true); };
  return html`<div className="install glass" role="note"><span className="ic"><${Icon} n="share" size=${17}/></span><span>Add SwipeJoy to your Home Screen: tap Share, then Add to Home Screen.</span><button type="button" onClick=${close}>Got it</button></div>`;
}

/* ---------- app ---------- */
function App(){
  var a = useState(function(){ return normalize(load()); }), s = a[0], setS = a[1];
  var tb = useState('today'), tab = tb[0], setTab = tb[1];
  var nw = useState(Date.now()), now = nw[0], setNow = nw[1];
  var update = useCallback(function(patch){
    setS(function(p){ var n = Object.assign({}, p, typeof patch === 'function' ? patch(p) : patch); save(n); return n; });
  }, []);
  var reset = function(){ try { localStorage.removeItem(KEY); } catch(e){} setS(normalize(Object.assign({}, DEFAULT))); setTab('today'); };

  useEffect(function(){ var id = setInterval(function(){ setNow(Date.now()); }, 1000); return function(){ clearInterval(id); }; }, []);
  useEffect(function(){ if (s.today.date !== todayKey(new Date(now))) update(function(p){ return normalize(p); }); }, [now]);
  useEffect(function(){
    var root = document.documentElement;
    if (s.theme === 'light' || s.theme === 'dark') root.setAttribute('data-theme', s.theme); else root.removeAttribute('data-theme');
  }, [s.theme]);
  useEffect(function(){
    if (!s.reminderOn) return;
    var id = setInterval(function(){
      try {
        if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
        var d = new Date(), key = todayKey(d);
        if (pad(d.getHours())+':'+pad(d.getMinutes()) === s.reminderTime && s.lastNotified !== key && !s.today.done) {
          new Notification('SwipeJoy ✨', { body:'Your daily joy is waiting. Find 3 affirmations that make you smile.' });
          update({ lastNotified:key });
        }
      } catch(e){}
    }, 15000);
    return function(){ clearInterval(id); };
  }, [s.reminderOn, s.reminderTime, s.lastNotified, s.today.done]);

  var onDone = function(p){ update(Object.assign({ onboarded:true }, p)); };

  return html`<div className="app">
    <div className="island" aria-hidden="true"></div>
    <${BgArt}/>
    ${!s.onboarded
      ? html`<${Onboarding} onDone=${onDone}/>`
      : html`<main className="screen">
          ${tab === 'today'
            ? (s.today.done ? html`<${Complete} key="done" s=${s} now=${now}/>` : html`<${Session} key="session" s=${s} update=${update} now=${now}/>`)
            : html`<${Profile} key="profile" s=${s} update=${update} onReset=${reset}/>`}
          <${InstallHint}/>
        </main>
        <nav className="nav glass" aria-label="Main">
          <button type="button" className="tab" aria-current=${tab==='today'?'page':undefined} onClick=${function(){ setTab('today'); }}><${Icon} n="sun" size=${22}/>Today's Session</button>
          <button type="button" className="tab" aria-current=${tab==='profile'?'page':undefined} onClick=${function(){ setTab('profile'); }}><${Icon} n="user" size=${22}/>My Profile</button>
        </nav>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
</body>
</html>
